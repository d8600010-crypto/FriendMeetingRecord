<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浪潮點播｜台灣歌手精選歌單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1F2B;
    --ink-soft:#2E3448;
    --paper:#F2ECDF;
    --paper-dim:#E7DFCB;
    --gold:#D4A24C;
    --gold-bright:#F0BE6A;
    --coral:#E8595F;
    --line: rgba(242,236,223,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(212,162,76,0.10), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(232,89,95,0.10), transparent 40%),
      var(--ink);
    color:var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  /* ---------- Header ---------- */
  header{
    position:relative;
    padding:64px 24px 40px;
    max-width:920px;
    margin:0 auto;
    text-align:center;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:0.35em;
    color:var(--gold-bright);
    text-transform:uppercase;
    margin-bottom:18px;
    font-weight:700;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(34px, 6vw, 58px);
    line-height:1.25;
    margin:0 0 16px;
    letter-spacing:0.02em;
  }
  h1 .accent{color:var(--gold-bright);}
  .lede{
    color:rgba(242,236,223,0.7);
    font-size:16px;
    max-width:560px;
    margin:0 auto;
    line-height:1.9;
  }
  /* ---------- Ticket counter ---------- */
  .ticket{
    position:sticky;
    top:16px;
    z-index:30;
    display:flex;
    justify-content:center;
    margin:32px auto 8px;
  }
  .ticket-inner{
    background:var(--paper);
    color:var(--ink);
    border-radius:999px;
    padding:10px 26px;
    display:flex;
    align-items:center;
    gap:12px;
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:15px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    border:1px dashed var(--ink);
  }
  .ticket-inner .num{
    font-size:20px;
    color:var(--coral);
    min-width:1.4em;
    text-align:center;
    display:inline-block;
  }
  .ticket-inner .dot{
    width:6px;height:6px;border-radius:50%;background:var(--gold);
  }
  /* ---------- Tabs ---------- */
  .tab-wrap{
    max-width:920px;
    margin:28px auto 0;
    padding:0 20px;
  }
  .tab-nav{
    display:flex;
    gap:4px;
    overflow-x:auto;
    scrollbar-width:none;
    border-bottom:1px solid var(--line);
  }
  .tab-nav::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:none;
    background:none;
    border:none;
    color:rgba(242,236,223,0.5);
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:15px;
    padding:14px 20px;
    cursor:pointer;
    position:relative;
    letter-spacing:0.02em;
    white-space:nowrap;
    transition:color 0.15s ease;
  }
  .tab-btn::after{
    content:"";
    position:absolute;
    left:14px; right:14px; bottom:-1px;
    height:3px;
    background:var(--coral);
    border-radius:3px 3px 0 0;
    transform:scaleX(0);
    transition:transform 0.18s ease;
  }
  .tab-btn:hover{color:rgba(242,236,223,0.8);}
  .tab-btn.active{color:var(--gold-bright);}
  .tab-btn.active::after{transform:scaleX(1);}
  .tab-btn:focus-visible{outline:2px solid var(--gold-bright); outline-offset:2px;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  /* ---------- Singer filter ---------- */
  .filter-wrap{
    max-width:920px;
    margin:0 auto;
    padding:24px 20px 0;
  }
  .filter-box{
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 24px 22px;
  }
  .filter-title{
    font-family:'Noto Serif TC', serif;
    font-size:15px;
    font-weight:700;
    color:var(--gold-bright);
    letter-spacing:0.05em;
    margin-bottom:14px;
  }
  .filter-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .filter-chip{
    position:relative;
    display:inline-flex;
  }
  .filter-chip input{
    position:absolute;
    opacity:0;
    width:100%; height:100%;
    margin:0;
    cursor:pointer;
  }
  .filter-chip span{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    font-size:14px;
    font-weight:500;
    color:rgba(242,236,223,0.65);
    transition:all 0.15s ease;
  }
  .filter-chip span::before{
    content:"";
    width:7px; height:7px;
    border-radius:50%;
    background:rgba(242,236,223,0.25);
    transition:background 0.15s ease;
  }
  .filter-chip input:checked ~ span{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--ink);
    font-weight:700;
  }
  .filter-chip input:checked ~ span::before{
    background:var(--coral);
  }
  .filter-chip input:focus-visible ~ span{
    outline:2px solid var(--gold-bright);
    outline-offset:2px;
  }
  .page.hidden-by-filter{display:none;}
  /* ---------- Main ---------- */
  main{
    max-width:920px;
    margin:0 auto;
    padding:0 20px 40px;
  }
  .book{
    display:flex;
    flex-direction:column;
    gap:22px;
    padding-top:22px;
  }
  .page{
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    padding:28px 30px 20px;
    position:relative;
    box-shadow:0 14px 36px rgba(0,0,0,0.30);
    border:1px solid rgba(27,31,43,0.06);
  }
  .page::before{
    content:"";
    position:absolute;
    left:0; top:22px; bottom:22px;
    width:4px;
    background:var(--coral);
    border-radius:0 4px 4px 0;
  }
  .page-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding-bottom:14px;
    border-bottom:2px solid var(--ink);
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .singer-name{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:26px;
    letter-spacing:0.04em;
  }
  .singer-tag{
    font-size:12.5px;
    color:rgba(27,31,43,0.55);
    font-weight:500;
    letter-spacing:0.03em;
  }
  .song-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 4px;
    border-bottom:1px solid rgba(27,31,43,0.10);
    cursor:pointer;
  }
  .song-row:last-of-type{border-bottom:none;}
  /* KTV stamp checkbox */
  .stamp{
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    border:2px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .song-row input{
    position:absolute;
    opacity:0;
    width:34px;height:34px;
    margin:0;
    cursor:pointer;
  }
  .stamp svg{
    width:18px;height:18px;
    opacity:0;
    transform:scale(0.5) rotate(-15deg);
    transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .song-row input:checked ~ .stamp{
    background:var(--coral);
    border-color:var(--coral);
  }
  .song-row input:checked ~ .stamp svg{
    opacity:1;
    transform:scale(1) rotate(0deg);
  }
  .song-row input:focus-visible ~ .stamp{
    outline:3px solid var(--gold);
    outline-offset:2px;
  }
  .song-row:hover .stamp{transform:scale(1.05);}
  .song-info{flex:1; min-width:0;}
  .song-title{
    font-weight:700;
    font-size:16.5px;
    transition:color 0.15s ease, text-decoration-color 0.15s ease;
  }
  .song-row input:checked ~ .song-info .song-title{
    color:var(--coral);
  }
  .song-meta{
    font-size:12.5px;
    color:rgba(27,31,43,0.5);
    margin-top:2px;
  }
  @media (prefers-reduced-motion: reduce){
    .stamp, .stamp svg, .song-row .stamp{transition:none;}
  }
  /* ---------- Summary ---------- */
  .summary{
    margin-top:34px;
    background:var(--ink-soft);
    border-radius:14px;
    padding:26px 30px 28px;
    border:1px solid var(--line);
  }
  .summary-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    flex-wrap:wrap;
    gap:10px;
  }
  .summary-head h2{
    font-family:'Noto Serif TC', serif;
    font-size:20px;
    margin:0;
    font-weight:700;
    letter-spacing:0.03em;
  }
  .empty-state{
    color:rgba(242,236,223,0.45);
    font-size:14px;
    padding:18px 4px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:10px;
  }
  .summary-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .summary-item{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    padding:9px 12px;
    background:rgba(242,236,223,0.05);
    border-radius:8px;
    border:1px solid var(--line);
    flex-wrap:wrap;
  }
  .summary-item .cat{
    font-size:11px;
    color:rgba(242,236,223,0.4);
    border:1px solid var(--line);
    border-radius:999px;
    padding:2px 9px;
    flex:none;
  }
  .summary-item .who{
    color:var(--gold-bright);
    font-weight:700;
    flex:none;
  }
  .summary-item .what{color:rgba(242,236,223,0.85);}
  .clear-btn{
    background:none;
    border:1px solid var(--line);
    color:rgba(242,236,223,0.7);
    font-family:'Noto Sans TC', sans-serif;
    font-size:12.5px;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .clear-btn:hover{border-color:var(--coral); color:var(--coral);}
  .info-strip{
    max-width:920px;
    margin:0 auto;
    padding:0 20px;
    text-align:center;
  }
  .info-strip h1{
    font-family:'Noto Sans TC', sans-serif;
    font-size:13px;
    font-weight:500;
    color:rgba(242,236,223,0.45);
    margin:0;
    letter-spacing:0.02em;
  }
  .info-strip h2{
    font-family:'Noto Sans TC', sans-serif;
    font-size:13px;
    font-weight:500;
    color:rgba(242,236,223,0.45);
    margin:2px 0 0;
    letter-spacing:0.02em;
  }
  footer{
    text-align:center;
    padding:30px 20px 50px;
    font-size:12px;
    color:rgba(242,236,223,0.35);
    letter-spacing:0.05em;
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Taiwan Singers Playlist</div>
  <h1>浪潮點播<br><span class="accent">台灣歌手</span>精選歌單</h1>
  <p class="lede">四大分類、橫跨世代的台灣歌手，勾選喜歡的歌曲，就像在 KTV 點歌本裡畫記號一樣。</p>
</header>
<div class="info-strip">
  <h1>github on the d8600010@stmail.cgu.edu.tw</h1>
  <h2>GoogleDrive SpreadSheet 台灣歌手精選歌單</h2>
</div>
<div class="ticket">
  <div class="ticket-inner">
    <span class="dot"></span>
    已點 <span class="num" id="countNum">0</span> 首
  </div>
</div>
<div class="tab-wrap">
  <div class="tab-nav" role="tablist">
    <button class="tab-btn active" data-tab="female-mando" role="tab" aria-selected="true">台灣女聲國語歌手</button>
    <button class="tab-btn" data-tab="male-mando" role="tab" aria-selected="false">台灣男聲國語歌手</button>
    <button class="tab-btn" data-tab="male-taiyu" role="tab" aria-selected="false">台灣男聲台語歌手</button>
    <button class="tab-btn" data-tab="female-taiyu" role="tab" aria-selected="false">台灣女聲台語歌手</button>
    <button class="tab-btn" data-tab="favorites" role="tab" aria-selected="false">我的最愛</button>
  </div>
</div>
<main>
<!-- ===================== TAB 1：台灣女聲國語歌手 ===================== -->
<div class="tab-panel active" data-tab-panel="female-mando">
  <div class="filter-wrap">
    <div class="filter-box">
      <div class="filter-title">歌手篩選</div>
      <div class="filter-list" data-filter-list="female-mando"></div>
    </div>
  </div>
  <div class="book" data-book="female-mando"></div>
</div>
<!-- ===================== TAB 2：台灣男聲國語歌手 ===================== -->
<div class="tab-panel" data-tab-panel="male-mando">
  <div class="filter-wrap">
    <div class="filter-box">
      <div class="filter-title">歌手篩選</div>
      <div class="filter-list" data-filter-list="male-mando"></div>
    </div>
  </div>
  <div class="book" data-book="male-mando"></div>
</div>
<!-- ===================== TAB 3：台灣男聲台語歌手 ===================== -->
<div class="tab-panel" data-tab-panel="male-taiyu">
  <div class="filter-wrap">
    <div class="filter-box">
      <div class="filter-title">歌手篩選</div>
      <div class="filter-list" data-filter-list="male-taiyu"></div>
    </div>
  </div>
  <div class="book" data-book="male-taiyu"></div>
</div>
<!-- ===================== TAB 4：台灣女聲台語歌手 ===================== -->
<div class="tab-panel" data-tab-panel="female-taiyu">
  <div class="filter-wrap">
    <div class="filter-box">
      <div class="filter-title">歌手篩選</div>
      <div class="filter-list" data-filter-list="female-taiyu"></div>
    </div>
  </div>
  <div class="book" data-book="female-taiyu"></div>
</div>
  <div class="summary">
    <div class="summary-head">
      <h2>已選歌曲摘要</h2>
      <button class="clear-btn" id="clearBtn">清除全部</button>
    </div>
    <div id="summaryBody">
      <div class="empty-state">尚未點歌，勾選上方歌曲即可加入摘要</div>
    </div>
  </div>
</main>
<!-- ===================== TAB 5：我的最愛 ===================== -->
<div class="tab-panel" data-tab-panel="favorites">
  <div style="max-width:920px;margin:0 auto;padding:24px 20px 40px;">
    <div class="page" style="margin:0;">
      <div class="page-head">
        <span class="singer-name">我的最愛</span>
        <span class="singer-tag">已勾選的所有歌曲</span>
      </div>
      <div id="favoritesBody">
        <div class="empty-state" style="color:rgba(27,31,43,0.4);border-color:rgba(27,31,43,0.15);">尚未點歌，到各歌手分頁勾選歌曲後會出現在這裡</div>
      </div>
      <div style="margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <button id="syncBtn" style="background:var(--coral);color:#fff;border:none;border-radius:999px;padding:10px 22px;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:14px;cursor:pointer;">同步到 Google Sheet</button>
        <span id="syncStatus" style="font-size:12.5px;color:rgba(27,31,43,0.5);"></span>
      </div>
    </div>
  </div>
</div>
<footer>浪潮點播 · 台灣歌手精選歌單</footer>
<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkFbLnUhydUhm9m4SWjZrsnB9BzSxu1BhuoqM9ze2OubtpGQK3kl9w-ROulV-hwKLfcQ/exec';

  const TAB_MAP = {
    '女聲國語': { slug: 'female-mando', label: '台灣女聲國語歌手' },
    '男聲國語': { slug: 'male-mando',   label: '台灣男聲國語歌手' },
    '男聲台語': { slug: 'male-taiyu',   label: '台灣男聲台語歌手' },
    '女聲台語': { slug: 'female-taiyu', label: '台灣女聲台語歌手' }
  };
  const TAB_ORDER = ['female-mando', 'male-mando', 'male-taiyu', 'female-taiyu'];

  let checkboxes = [];
  const countNum = document.getElementById('countNum');
  const summaryBody = document.getElementById('summaryBody');
  const favoritesBody = document.getElementById('favoritesBody');
  const clearBtn = document.getElementById('clearBtn');
  const syncBtn = document.getElementById('syncBtn');
  const syncStatus = document.getElementById('syncStatus');

  function buildItem(cb){
    const singer = cb.closest('.page').dataset.singer;
    const song = cb.dataset.song;
    const cat = cb.dataset.cat;
    const item = document.createElement('div');
    item.className = 'summary-item';
    item.innerHTML = '<span class="cat">' + cat + '</span><span class="who">' + singer + '</span><span class="what">' + song + '</span>';
    return item;
  }

  function render(){
    const checked = checkboxes.filter(cb => cb.checked);
    countNum.textContent = checked.length;
    if(checked.length === 0){
      summaryBody.innerHTML = '<div class="empty-state">尚未點歌，勾選上方歌曲即可加入摘要</div>';
      favoritesBody.innerHTML = '<div class="empty-state" style="color:rgba(27,31,43,0.4);border-color:rgba(27,31,43,0.15);">尚未點歌，到各歌手分頁勾選歌曲後會出現在這裡</div>';
      return;
    }
    const list = document.createElement('div');
    list.className = 'summary-list';
    const favList = document.createElement('div');
    favList.className = 'summary-list';
    checked.forEach(cb => {
      list.appendChild(buildItem(cb));
      favList.appendChild(buildItem(cb));
    });
    summaryBody.innerHTML = '';
    summaryBody.appendChild(list);
    favoritesBody.innerHTML = '';
    favoritesBody.appendChild(favList);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function escapeAttr(str){
    return escapeHtml(str);
  }

  // ---- Fetch live song data and render tabs ----
  async function loadSongs(){
    try {
      const res = await fetch(SCRIPT_URL + '?action=songs');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      renderFromData(data);
    } catch (err) {
      TAB_ORDER.forEach(slug => {
        const book = document.querySelector('.book[data-book="' + slug + '"]');
        if(book){
          book.innerHTML = '<div class="empty-state">無法載入歌曲資料，請確認 Apps Script 部署狀態後重新整理頁面。</div>';
        }
      });
    }
  }

  function renderFromData(rows){
    // group rows by tab slug, then by singer, deduping identical singer+song pairs
    const byTab = {};
    TAB_ORDER.forEach(slug => { byTab[slug] = new Map(); });

    rows.forEach(row => {
      const tabInfo = TAB_MAP[row.Tab];
      if(!tabInfo) return;
      const slug = tabInfo.slug;
      const singer = row.Singer || '';
      const song = row.Song || '';
      const note = row.Note || '';
      const cat = row.Category || row.Tab;
      if(!byTab[slug].has(singer)) byTab[slug].set(singer, new Map());
      const songsMap = byTab[slug].get(singer);
      const key = song; // dedupe by song name within singer
      if(!songsMap.has(key)) songsMap.set(key, { song, note, cat });
    });

    TAB_ORDER.forEach(slug => {
      const book = document.querySelector('.book[data-book="' + slug + '"]');
      const filterList = document.querySelector('.filter-list[data-filter-list="' + slug + '"]');
      if(!book || !filterList) return;

      const singerMap = byTab[slug];
      if(singerMap.size === 0){
        book.innerHTML = '<div class="empty-state">此分類目前沒有歌曲資料。</div>';
        return;
      }

      let filterHtml = '';
      let bookHtml = '';
      singerMap.forEach((songsMap, singer) => {
        const safeSinger = escapeAttr(singer);
        filterHtml += '<label class="filter-chip"><input type="checkbox" data-filter="' + safeSinger + '"><span>' + escapeHtml(singer) + '</span></label>';

        let rowsHtml = '';
        songsMap.forEach(({ song, note, cat }) => {
          rowsHtml += '<label class="song-row">' +
            '<input type="checkbox" data-cat="' + escapeAttr(cat) + '" data-song="' + escapeAttr(song) + '">' +
            '<span class="stamp">✓</span>' +
            '<span class="song-info"><div class="song-title">' + escapeHtml(song) + '</div><div class="song-meta">' + escapeHtml(note) + '</div></span>' +
            '</label>';
        });

        bookHtml += '<section class="page" data-singer="' + safeSinger + '">' +
          '<div class="page-head"><span class="singer-name">' + escapeHtml(singer) + '</span></div>' +
          rowsHtml +
          '</section>';
      });

      filterList.innerHTML = filterHtml;
      book.innerHTML = bookHtml;
    });

    // now that DOM exists, wire everything up
    initInteractions();
  }

  function initInteractions(){
    checkboxes = Array.from(document.querySelectorAll('.song-row input[type="checkbox"]'));
    checkboxes.forEach(cb => cb.addEventListener('change', render));
    render();

    // ---- Singer filter (scoped per tab) ----
    document.querySelectorAll('.tab-panel').forEach(panel => {
      const filterInputs = Array.from(panel.querySelectorAll('.filter-list input[type="checkbox"]'));
      const pages = Array.from(panel.querySelectorAll('.page'));
      function applyFilter(){
        const activeSingers = filterInputs.filter(f => f.checked).map(f => f.dataset.filter);
        pages.forEach(page => {
          const singer = page.dataset.singer;
          page.classList.toggle('hidden-by-filter', activeSingers.length > 0 && !activeSingers.includes(singer));
        });
      }
      filterInputs.forEach(f => f.addEventListener('change', applyFilter));
      applyFilter();
    });
  }

  clearBtn.addEventListener('click', () => {
    checkboxes.forEach(cb => cb.checked = false);
    render();
  });

  // ---- Sync favorites to Google Sheet via Apps Script Web App ----
  syncBtn.addEventListener('click', async () => {
    const checked = checkboxes.filter(cb => cb.checked);
    if(checked.length === 0){
      syncStatus.textContent = '請先勾選歌曲';
      return;
    }
    const payload = {
      songs: checked.map(cb => ({
        category: cb.dataset.cat,
        singer: cb.closest('.page').dataset.singer,
        song: cb.dataset.song
      }))
    };
    syncStatus.textContent = '同步中...';
    syncBtn.disabled = true;
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      syncStatus.textContent = '已送出 ' + checked.length + ' 首歌曲到 Google Sheet';
    } catch (err) {
      syncStatus.textContent = '同步失敗，請檢查連線或稍後再試';
    } finally {
      syncBtn.disabled = false;
    }
  });

  // ---- Tab switching ----
  const tabBtns = Array.from(document.querySelectorAll('.tab-btn'));
  const tabPanels = Array.from(document.querySelectorAll('.tab-panel'));
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;
      tabBtns.forEach(b => {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
      });
      tabPanels.forEach(p => {
        p.classList.toggle('active', p.dataset.tabPanel === target);
      });
    });
  });

  loadSongs();
</script>
</body>
</html>
