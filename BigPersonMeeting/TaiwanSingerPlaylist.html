<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浪潮點播｜台灣歌手精選歌單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1F2B;
    --ink-soft:#2E3448;
    --paper:#F2ECDF;
    --paper-dim:#E7DFCB;
    --gold:#D4A24C;
    --gold-bright:#F0BE6A;
    --coral:#E8595F;
    --line: rgba(242,236,223,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(212,162,76,0.10), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(232,89,95,0.10), transparent 40%),
      var(--ink);
    color:var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  header{
    position:relative;
    padding:64px 24px 40px;
    max-width:920px;
    margin:0 auto;
    text-align:center;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:0.35em;
    color:var(--gold-bright);
    text-transform:uppercase;
    margin-bottom:18px;
    font-weight:700;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(34px, 6vw, 58px);
    line-height:1.25;
    margin:0 0 16px;
    letter-spacing:0.02em;
  }
  h1 .accent{color:var(--gold-bright);}
  .lede{
    color:rgba(242,236,223,0.7);
    font-size:16px;
    max-width:560px;
    margin:0 auto;
    line-height:1.9;
  }
  .ticket{
    position:sticky;
    top:16px;
    z-index:30;
    display:flex;
    justify-content:center;
    margin:32px auto 8px;
  }
  .ticket-inner{
    background:var(--paper);
    color:var(--ink);
    border-radius:999px;
    padding:10px 26px;
    display:flex;
    align-items:center;
    gap:12px;
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:15px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    border:1px dashed var(--ink);
  }
  .ticket-inner .num{
    font-size:20px;
    color:var(--coral);
    min-width:1.4em;
    text-align:center;
    display:inline-block;
  }
  .ticket-inner .dot{
    width:6px;height:6px;border-radius:50%;background:var(--gold);
  }
  .tab-wrap{
    max-width:920px;
    margin:28px auto 0;
    padding:0 20px;
  }
  .tab-nav{
    display:flex;
    gap:4px;
    overflow-x:auto;
    scrollbar-width:none;
    border-bottom:1px solid var(--line);
  }
  .tab-nav::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:none;
    background:none;
    border:none;
    color:rgba(242,236,223,0.5);
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:15px;
    padding:14px 20px;
    cursor:pointer;
    position:relative;
    letter-spacing:0.02em;
    white-space:nowrap;
    transition:color 0.15s ease;
  }
  .tab-btn::after{
    content:"";
    position:absolute;
    left:14px; right:14px; bottom:-1px;
    height:3px;
    background:var(--coral);
    border-radius:3px 3px 0 0;
    transform:scaleX(0);
    transition:transform 0.18s ease;
  }
  .tab-btn:hover{color:rgba(242,236,223,0.8);}
  .tab-btn.active{color:var(--gold-bright);}
  .tab-btn.active::after{transform:scaleX(1);}
  .tab-btn:focus-visible{outline:2px solid var(--gold-bright); outline-offset:2px;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .filter-wrap{
    max-width:920px;
    margin:0 auto;
    padding:24px 20px 0;
  }
  .filter-box{
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 24px 22px;
  }
  .filter-title{
    font-family:'Noto Serif TC', serif;
    font-size:15px;
    font-weight:700;
    color:var(--gold-bright);
    letter-spacing:0.05em;
    margin-bottom:14px;
  }
  .filter-list{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .filter-chip{
    position:relative;
    display:inline-flex;
  }
  .filter-chip input{
    position:absolute;
    opacity:0;
    width:100%; height:100%;
    margin:0;
    cursor:pointer;
  }
  .filter-chip span{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    font-size:14px;
    font-weight:500;
    color:rgba(242,236,223,0.65);
    transition:all 0.15s ease;
  }
  .filter-chip span::before{
    content:"";
    width:7px; height:7px;
    border-radius:50%;
    background:rgba(242,236,223,0.25);
    transition:background 0.15s ease;
  }
  .filter-chip input:checked ~ span{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--ink);
    font-weight:700;
  }
  .filter-chip input:checked ~ span::before{
    background:var(--coral);
  }
  .filter-chip input:focus-visible ~ span{
    outline:2px solid var(--gold-bright);
    outline-offset:2px;
  }
  .page.hidden-by-filter{display:none;}
  main{
    max-width:920px;
    margin:0 auto;
    padding:0 20px 40px;
  }
  .book{
    display:flex;
    flex-direction:column;
    gap:22px;
    padding-top:22px;
  }
  .page{
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    padding:28px 30px 20px;
    position:relative;
    box-shadow:0 14px 36px rgba(0,0,0,0.30);
    border:1px solid rgba(27,31,43,0.06);
  }
  .page::before{
    content:"";
    position:absolute;
    left:0; top:22px; bottom:22px;
    width:4px;
    background:var(--coral);
    border-radius:0 4px 4px 0;
  }
  .page-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding-bottom:14px;
    border-bottom:2px solid var(--ink);
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .singer-name{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:26px;
    letter-spacing:0.04em;
  }
  .singer-tag{
    font-size:12.5px;
    color:rgba(27,31,43,0.55);
    font-weight:500;
    letter-spacing:0.03em;
  }
  .song-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 4px;
    border-bottom:1px solid rgba(27,31,43,0.10);
    cursor:pointer;
  }
  .song-row:last-of-type{border-bottom:none;}
  .stamp{
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    border:2px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .song-row input{
    position:absolute;
    opacity:0;
    width:34px;height:34px;
    margin:0;
    cursor:pointer;
  }
  .stamp .mark{
    opacity:0;
    transform:scale(0.5) rotate(-15deg);
    transition:opacity 0.15s ease, transform 0.15s ease;
    font-size:16px;
    line-height:1;
    color:var(--paper);
  }
  .song-row input:checked ~ .stamp{
    background:var(--coral);
    border-color:var(--coral);
  }
  .song-row input:checked ~ .stamp .mark{
    opacity:1;
    transform:scale(1) rotate(0deg);
  }
  .song-row input:focus-visible ~ .stamp{
    outline:3px solid var(--gold);
    outline-offset:2px;
  }
  .song-row:hover .stamp{transform:scale(1.05);}
  .song-info{flex:1; min-width:0;}
  .song-title{
    font-weight:700;
    font-size:16.5px;
    transition:color 0.15s ease, text-decoration-color 0.15s ease;
  }
  .song-row input:checked ~ .song-info .song-title{
    color:var(--coral);
  }
  .song-meta{
    font-size:12.5px;
    color:rgba(27,31,43,0.5);
    margin-top:2px;
  }
  @media (prefers-reduced-motion: reduce){
    .stamp, .stamp .mark{transition:none;}
  }
  .summary{
    margin-top:34px;
    background:var(--ink-soft);
    border-radius:14px;
    padding:26px 30px 28px;
    border:1px solid var(--line);
  }
  .summary-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    flex-wrap:wrap;
    gap:10px;
  }
  .summary-head h2{
    font-family:'Noto Serif TC', serif;
    font-size:20px;
    margin:0;
    font-weight:700;
    letter-spacing:0.03em;
  }
  .empty-state{
    color:rgba(242,236,223,0.45);
    font-size:14px;
    padding:18px 4px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:10px;
  }
  .summary-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .summary-item{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    padding:9px 12px;
    background:rgba(242,236,223,0.05);
    border-radius:8px;
    border:1px solid var(--line);
    flex-wrap:wrap;
  }
  .summary-item .cat{
    font-size:11px;
    color:rgba(242,236,223,0.4);
    border:1px solid var(--line);
    border-radius:999px;
    padding:2px 9px;
    flex:none;
  }
  .summary-item .who{
    color:var(--gold-bright);
    font-weight:700;
    flex:none;
  }
  .summary-item .what{color:rgba(242,236,223,0.85);}
  .btn-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .clear-btn, .submit-btn{
    font-family:'Noto Sans TC', sans-serif;
    font-size:12.5px;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    border:1px solid var(--line);
  }
  .clear-btn{
    background:none;
    color:rgba(242,236,223,0.7);
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .clear-btn:hover{border-color:var(--coral); color:var(--coral);}
  .submit-btn{
    background:var(--coral);
    border-color:var(--coral);
    color:var(--paper);
    font-weight:700;
    transition:filter 0.15s ease;
  }
  .submit-btn:hover{filter:brightness(1.08);}
  .submit-btn:disabled{opacity:0.5; cursor:not-allowed;}
  .sync-status{
    font-size:12.5px;
    color:rgba(242,236,223,0.5);
    margin-top:12px;
    min-height:1.2em;
  }
  .sync-status.err{color:var(--coral);}
  .sync-status.ok{color:#8fd0a0;}
  .state-msg{
    text-align:center;
    padding:60px 20px;
    color:rgba(242,236,223,0.55);
    font-size:14px;
  }
  footer{
    text-align:center;
    padding:30px 20px 50px;
    font-size:12px;
    color:rgba(242,236,223,0.35);
    letter-spacing:0.05em;
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Taiwan Singers Playlist</div>
  <h1>浪潮點播<br><span class="accent">台灣歌手</span>精選歌單</h1>
  <p class="lede">四大分類、橫跨世代的台灣歌手，勾選喜歡的歌曲，就像在 KTV 點歌本裡畫記號一樣。歌曲清單即時同步自 Google 試算表。</p>
</header>
<div class="ticket">
  <div class="ticket-inner">
    <span class="dot"></span>
    已點 <span class="num" id="countNum">0</span> 首
  </div>
</div>
<div class="tab-wrap">
  <div class="tab-nav" role="tablist" id="tabNav"></div>
</div>
<main>
  <div id="appRoot">
    <div class="state-msg" id="stateMsg">正在從試算表載入歌單…</div>
  </div>
  <div class="summary">
    <div class="summary-head">
      <h2>已選歌曲摘要</h2>
      <div class="btn-row">
        <button class="clear-btn" id="clearBtn">清除全部</button>
        <button class="submit-btn" id="submitBtn">送出點歌</button>
      </div>
    </div>
    <div id="summaryBody">
      <div class="empty-state">尚未點歌，勾選上方歌曲即可加入摘要</div>
    </div>
    <div class="sync-status" id="syncStatus"></div>
  </div>
</main>
<footer>浪潮點播 · 台灣歌手精選歌單</footer>
<script>
  /* ====== 設定：貼上你部署好的 Apps Script Web App 網址 ====== */
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzrR6VSIaCZ34-TByK3pApaGoRWAcA4NudBAV2oyS8MrqI6UmI7VpghV11qWWgrko7MEQ/exec';
  /* =========================================================== */

  const tabNav = document.getElementById('tabNav');
  const appRoot = document.getElementById('appRoot');
  const stateMsg = document.getElementById('stateMsg');
  const countNum = document.getElementById('countNum');
  const summaryBody = document.getElementById('summaryBody');
  const clearBtn = document.getElementById('clearBtn');
  const submitBtn = document.getElementById('submitBtn');
  const syncStatus = document.getElementById('syncStatus');

  let songsData = [];   // 從試算表讀回的原始資料
  let tabsOrder = [];   // 依出現順序排列的 tab id
  let checkboxes = [];  // 目前渲染出的所有 checkbox

  init();

  async function init(){
    if(!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
      stateMsg.textContent = '尚未設定 Apps Script 網址：請依 SETUP.md 部署後，把網址貼到 index.html 最上面的 SCRIPT_URL。';
      return;
    }
    try{
      const res = await fetch(SCRIPT_URL + '?action=songs');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      songsData = await res.json();
      if(!Array.isArray(songsData) || songsData.length === 0){
        stateMsg.textContent = '試算表的 Songs 工作表目前是空的，請先在 Apps Script 執行一次 setup()。';
        return;
      }
      buildUI();
    }catch(err){
      stateMsg.textContent = '讀取試算表失敗：' + err.message + '（請確認 Web App 已部署為「任何人」可存取）。';
    }
  }

  function buildUI(){
    // 依 Tab 分組，保留第一次出現的順序
    const tabs = new Map();
    songsData.forEach(row => {
      if(!tabs.has(row.Tab)){
        tabs.set(row.Tab, { id: row.Tab, label: row.TabLabel, singers: new Map() });
      }
      const tab = tabs.get(row.Tab);
      if(!tab.singers.has(row.Singer)){
        tab.singers.set(row.Singer, { tag: row.SingerTag, cat: row.Category, songs: [] });
      }
      tab.singers.get(row.Singer).songs.push({ song: row.Song, meta: row.SongMeta });
    });
    tabsOrder = Array.from(tabs.keys());

    // Tab nav
    tabNav.innerHTML = '';
    tabsOrder.forEach((tabId, i) => {
      const tab = tabs.get(tabId);
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
      btn.dataset.tab = tabId;
      btn.setAttribute('role','tab');
      btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      btn.textContent = tab.label;
      tabNav.appendChild(btn);
    });

    // Panels
    appRoot.innerHTML = '';
    tabsOrder.forEach((tabId, i) => {
      const tab = tabs.get(tabId);
      const panel = document.createElement('div');
      panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
      panel.dataset.tabPanel = tabId;

      const filterWrap = document.createElement('div');
      filterWrap.className = 'filter-wrap';
      const filterBox = document.createElement('div');
      filterBox.className = 'filter-box';
      filterBox.innerHTML = '<div class="filter-title">歌手篩選</div>';
      const filterList = document.createElement('div');
      filterList.className = 'filter-list';
      filterList.dataset.filterList = tabId;

      const book = document.createElement('div');
      book.className = 'book';
      book.dataset.book = tabId;

      Array.from(tab.singers.entries()).forEach(([singerName, singer]) => {
        const chip = document.createElement('label');
        chip.className = 'filter-chip';
        chip.innerHTML = '<input type="checkbox" data-filter="' + escapeAttr(singerName) + '" checked><span>' + escapeHtml(singerName) + '</span>';
        filterList.appendChild(chip);

        const page = document.createElement('section');
        page.className = 'page';
        page.dataset.singer = singerName;
        page.dataset.tab = tabId;

        const head = document.createElement('div');
        head.className = 'page-head';
        head.innerHTML = '<span class="singer-name">' + escapeHtml(singerName) + '</span><span class="singer-tag">' + escapeHtml(singer.tag || '') + '</span>';
        page.appendChild(head);

        singer.songs.forEach(s => {
          const row = document.createElement('label');
          row.className = 'song-row';
          row.innerHTML =
            '<input type="checkbox" data-cat="' + escapeAttr(singer.cat || '') + '" data-song="' + escapeAttr(s.song) + '">' +
            '<span class="stamp"><span class="mark">✓</span></span>' +
            '<span class="song-info"><div class="song-title">' + escapeHtml(s.song) + '</div><div class="song-meta">' + escapeHtml(s.meta || '') + '</div></span>';
          page.appendChild(row);
        });

        book.appendChild(page);
      });

      filterBox.appendChild(filterList);
      filterWrap.appendChild(filterBox);
      panel.appendChild(filterWrap);
      panel.appendChild(book);
      appRoot.appendChild(panel);
    });

    wireUpEvents();
  }

  function wireUpEvents(){
    checkboxes = Array.from(document.querySelectorAll('.song-row input[type="checkbox"]'));
    checkboxes.forEach(cb => cb.addEventListener('change', renderSummary));

    clearBtn.addEventListener('click', () => {
      checkboxes.forEach(cb => cb.checked = false);
      renderSummary();
    });

    submitBtn.addEventListener('click', submitToSheet);

    document.querySelectorAll('.tab-panel').forEach(panel => {
      const filterInputs = Array.from(panel.querySelectorAll('.filter-list input[type="checkbox"]'));
      const pages = Array.from(panel.querySelectorAll('.page'));
      function applyFilter(){
        const activeSingers = filterInputs.filter(f => f.checked).map(f => f.dataset.filter);
        pages.forEach(page => {
          page.classList.toggle('hidden-by-filter', !activeSingers.includes(page.dataset.singer));
        });
      }
      filterInputs.forEach(f => f.addEventListener('change', applyFilter));
      applyFilter();
    });

    const tabBtns = Array.from(document.querySelectorAll('.tab-btn'));
    const tabPanels = Array.from(document.querySelectorAll('.tab-panel'));
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.tab;
        tabBtns.forEach(b => {
          b.classList.toggle('active', b === btn);
          b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
        });
        tabPanels.forEach(p => p.classList.toggle('active', p.dataset.tabPanel === target));
      });
    });

    renderSummary();
  }

  function getSelected(){
    return checkboxes.filter(cb => cb.checked).map(cb => {
      const page = cb.closest('.page');
      return {
        tab: page.dataset.tab,
        singer: page.dataset.singer,
        cat: cb.dataset.cat,
        song: cb.dataset.song
      };
    });
  }

  function renderSummary(){
    const selected = getSelected();
    countNum.textContent = selected.length;
    submitBtn.disabled = selected.length === 0;
    if(selected.length === 0){
      summaryBody.innerHTML = '<div class="empty-state">尚未點歌，勾選上方歌曲即可加入摘要</div>';
      return;
    }
    const list = document.createElement('div');
    list.className = 'summary-list';
    selected.forEach(item => {
      const el = document.createElement('div');
      el.className = 'summary-item';
      el.innerHTML = '<span class="cat">' + escapeHtml(item.cat) + '</span><span class="who">' + escapeHtml(item.singer) + '</span><span class="what">' + escapeHtml(item.song) + '</span>';
      list.appendChild(el);
    });
    summaryBody.innerHTML = '';
    summaryBody.appendChild(list);
  }

  async function submitToSheet(){
    const selected = getSelected();
    if(selected.length === 0) return;
    if(!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
      syncStatus.textContent = '尚未設定 Apps Script 網址，無法送出。';
      syncStatus.className = 'sync-status err';
      return;
    }
    submitBtn.disabled = true;
    syncStatus.textContent = '送出中…';
    syncStatus.className = 'sync-status';
    try{
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避免觸發 CORS 預檢
        body: JSON.stringify({ songs: selected })
      });
      const data = await res.json();
      if(data.status === 'ok'){
        syncStatus.textContent = '已送出 ' + data.count + ' 首到點歌記錄！';
        syncStatus.className = 'sync-status ok';
      }else{
        throw new Error(data.message || '未知錯誤');
      }
    }catch(err){
      syncStatus.textContent = '送出失敗：' + err.message;
      syncStatus.className = 'sync-status err';
    }finally{
      submitBtn.disabled = getSelected().length === 0;
    }
  }

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(str){ return escapeHtml(str); }
</script>
